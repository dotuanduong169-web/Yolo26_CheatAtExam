services:
  postgres:
    image: postgres:16
    container_name: examcheat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: examcheat
      POSTGRES_PASSWORD: examcheat123
      POSTGRES_DB: examcheat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
