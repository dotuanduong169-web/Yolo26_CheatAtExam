services:
  postgres:
    image: postgres:16
    container_name: examcheat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: examcheat
      POSTGRES_PASSWORD: examcheat123
      POSTGRES_DB: examcheat
    ports:
      # Host 5433 (không phải 5432) để không đụng PostgreSQL đang chạy sẵn trên máy
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
